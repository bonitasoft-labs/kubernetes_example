{{- if .Values.ingress.enabled -}}
{{- $fullName := include "bonita.fullname" . -}}
{{- $serviceName := printf "%s-%s" $fullName (ternary "ui-proxy" "engine" .Values.uib.enabled) -}}
{{- $svcPort := .Values.services.bonita.port -}}
{{- $svcPort := ternary .Values.uib.proxy.service.port .Values.services.bonita.port .Values.uib.enabled -}}
{{- if and .Values.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "bonita.labels" . | nindent 4 }}
  {{- if .Values.ingress.annotations }}
  annotations:
    {{- include "bonita.tplvalues" (dict "value" .Values.ingress.annotations "context" $) | nindent 4 }}
  {{- end }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  {{- if and .Values.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ include "bonita.tplvalues" (dict "value" . "context" $) | quote }}
        {{- end }}
      secretName: {{ include "bonita.tplvalues" (dict "value" .secretName "context" $)}}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ include "bonita.tplvalues" (dict "value" .host "context" $) | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ include "bonita.tplvalues" (dict "value" .path "context" $)}}
            {{- if and .pathType (semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion) }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $serviceName }}
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ $serviceName }}
              servicePort: {{ $svcPort }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
