apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "bonita.fullname" . }}-hazelcast-rolebinding
  labels:
    {{- include "bonita.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "bonita.fullname" . }}-hazelcast
subjects:
- kind: ServiceAccount
  name: {{ include "bonita.serviceAccountName" . }}
  namespace: {{ .Release.Namespace | quote }}
