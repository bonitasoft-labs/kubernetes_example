apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bonita.fullname" . }}-env-vars
  labels:
    {{- include "bonita.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace | quote }}
data:
{{- if .Values.datasources.bonita.password }}
  DB_PASS: {{ include "bonita.tplvalues" (dict "value" .Values.datasources.bonita.password "context" $) | b64enc | quote }}
{{- end }}
{{- if .Values.datasources.bdm.password }}
  BIZ_DB_PASS: {{ include "bonita.tplvalues" (dict "value" .Values.datasources.bdm.password "context" $) | b64enc | quote }}
{{- end }}
{{- if .Values.credentials.tenant.username }}
  BONITA_RUNTIME_ADMIN_USERNAME: {{ include "bonita.tplvalues" (dict "value" .Values.credentials.tenant.username "context" $) | b64enc | quote }}
{{- end }}
{{- if .Values.credentials.tenant.password }}
  BONITA_RUNTIME_ADMIN_PASSWORD: {{ include "bonita.tplvalues" (dict "value" .Values.credentials.tenant.password "context" $) | b64enc | quote }}
{{- end }}
{{- if .Values.credentials.platform.username }}
  PLATFORM_LOGIN: {{ include "bonita.tplvalues" (dict "value" .Values.credentials.platform.username "context" $) | b64enc | quote }}
{{- end }}
{{- if .Values.credentials.platform.password }}
  PLATFORM_PASSWORD: {{ include "bonita.tplvalues" (dict "value" .Values.credentials.platform.password "context" $) | b64enc | quote }}
{{- end }}
{{- if .Values.credentials.monitoring.username }}
  MONITORING_USERNAME: {{ include "bonita.tplvalues" (dict "value" .Values.credentials.monitoring.username "context" $) | b64enc | quote }}
{{- end }}
{{- if .Values.credentials.monitoring.password }}
  MONITORING_PASSWORD: {{ include "bonita.tplvalues" (dict "value" .Values.credentials.monitoring.password "context" $) | b64enc | quote }}
{{- end }}
{{- if and .Values.httpApi.enabled .Values.httpApi.username .Values.httpApi.password }}
  HTTP_API_USERNAME: {{ include "bonita.tplvalues" (dict "value" .Values.httpApi.username "context" $) | b64enc | quote }}
  HTTP_API_PASSWORD: {{ include "bonita.tplvalues" (dict "value" .Values.httpApi.password "context" $) | b64enc | quote }}
{{- end }}
{{- if and .Values.usagemetrics.enabled .Values.usagemetrics.connectionAuthentication }}
  BONITA_RUNTIME_USAGEMETRICS_CONNECTION_AUTHENTICATION: {{ include "bonita.tplvalues" (dict "value" .Values.usagemetrics.connectionAuthentication "context" $) | b64enc | quote }}
{{- end }}
