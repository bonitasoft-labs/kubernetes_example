# Default values for bonita.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: bonitasoft.jfrog.io/docker/bonita-subscription
  pullPolicy: IfNotPresent
  pullSecrets: []
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "default"

podAnnotations: ""

podSecurityContext: {}
  # fsGroup: 2000

podInitContainers: []

podVolumes: []

podVolumeMounts: []

containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true

services:
  bonita:
    enabled: true
    type: ClusterIP
    port: 8080

  hazelcast:
    enabled: true
    type: ClusterIP
    port: 5701

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts: []
    # - host: chart-example.local
    #   paths:
    #     - path: /
    #       pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  # minReplicas: 1
  # maxReplicas: 100
  # targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

credentials:
  tenant: {}
    # username: ""
    # password: ""

  platform: {}
    # username: ""
    # password: ""

  monitoring: {}
    # username: ""
    # password: ""

httpApi: {}
  # enabled: true
  # username: "some_username"
  # password: "some_password"

licenseSecretName: ""

# Those scripts are executed first, before license copy, 'setup.sh init', 'setup.sh configure' and 'init scripts'
customConfigScripts: {}

# Those scripts are executed after the 'config scripts' (after 'setup.sh init' and 'setup.sh configure')
customInitScripts: {}

timezone: ""

progradePolicy: ""

accesslogs:
  stdoutEnabled: true
  filesEnabled: false
  filesPath: ""
  filesAppendHostname: true
  filesMaxDays: ""

datasources:
  bonita: {}
    # name: ""
    # vendor: ""
    # host: ""
    # port: ""
    # username: ""
    # password: ""
    # initialsize: 2
    # maxtotal: 10
    # minidle: 2
    # maxidle: 10

  bdm: {}
    # name: ""
    # vendor: ""
    # host: ""
    # port: ""
    # username: ""
    # password: ""
    # initialsize: 1
    # maxtotal: 5
    # minidle: 1
    # maxidle: 5

usagemetrics: {}
  # enabled: false
  # subscriptionId: "some_id"
  # runtimeId: "some_id"
  # accountName: "some_account_name"
  # connectionUrl: "some connection url"
  # connectionTimeout: "some connection timeout"
  # connectionAuthentication: "some connection authentication"

session:
  # 1 hour in seconds
  # will be reported in milliseconds in Docker environment variable
  # and also duplicated for cluster.http.session.timeout
  duration: 3600

# Maximum HTTP threads number Tomcat will use to serve HTTP/1.1 requests
# maxthreads_8080: ""

# XA transaction timeout (seconds)
# transactionXATimeout: ""

# Overrides the default path of the Heap dump file. Default value is /opt/bonita/logs
# heapDumpPath: ""

use_second_level_cache: false

uib:
  enabled: true
  builder:
    devMode: false
    replicaCount: 1
    image:
      repository: bonitasoft.jfrog.io/docker/bonita-ui-builder
      tag: 1.1.0
      pullSecrets: []
      pullPolicy: IfNotPresent
    containerSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
    service:
      enabled: true
      port: 80
      type: ClusterIP
    deploymentAnnotations: {}
    podAnnotations: ""
    podSecurityContext: {}  
    podInitContainers: []
    podVolumes: []
    podVolumeMounts: []
    resources: {}
    tolerations: []
    affinity: {}
    nodeSelector: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      # maxReplicas: 100
    externalConfigMapName: ""

  proxy:
    accessLogAll: 1
    configFileTemplate: ""
    replicaCount: 1
    image:
      repository: bonitasoft.jfrog.io/docker/bonita-ui-proxy
      tag: 1.0.0
      pullSecrets: []
      pullPolicy: IfNotPresent
    containerSecurityContext:
    service:
      enabled: true
      port: 80
      type: ClusterIP
    podAnnotations: ""
    podSecurityContext: {}  
    podInitContainers: []
    podVolumes: []
    podVolumeMounts: []
    resources: {}
    tolerations: []
    affinity: {}
    nodeSelector: {}
    autoscaling:
      enabled: false
      minReplicas: 1
      # maxReplicas: 100
    customErrorPages:
      enabled: false
      errorPages: {}

